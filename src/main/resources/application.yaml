spring:
  application:
    name: SpringBasics

  datasource:
    url: jdbc:h2:file:./data/springbasics;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: never   # data.sql won't re-run on every restart (data already persists in file)

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update  # only alters/adds schema, never drops existing data
    properties:
      hibernate:
        format_sql: true  # prints SQL in readable multi-line format
    defer-datasource-initialization: true

logging:
  level:
    org.hibernate.SQL: DEBUG                # logs all SQL statements
    org.hibernate.orm.jdbc.bind: TRACE      # logs actual bind parameter values
