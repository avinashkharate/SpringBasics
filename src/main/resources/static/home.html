<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plain HTML Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #eef2f3;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { color: #333; }
        p { color: #666; }
    </style>
</head>
<body>

<div class="card">
    <h1>Welcome to My Plain Web Page</h1>
    <p>This is standard HTML. No template engine required.</p>
</div>

</body>
</html>
